<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f6f2">
  <title>LEAD | 家族の幸せを、自分から。</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8f6f2;
      color: #303b4a;
      font-family: sans-serif;
      text-align: center;
    }

    .container {
      width: min(90%, 420px);
      padding: 40px 28px;
    }

    .logo {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 5px;
      color: #34445a;
    }

    .tagline {
      margin-top: 16px;
      font-size: 15px;
      letter-spacing: 2px;
    }

    .message {
      margin: 42px 0 28px;
      color: #777;
      line-height: 1.9;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 1px solid #d8d5cf;
      border-radius: 10px;
      background: white;
      color: #34445a;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #f0eee9;
    }

    #status {
      margin-top: 20px;
      font-size: 13px;
      color: #777;
      overflow-wrap: anywhere;
    }

    
.wife-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 24px;
  text-align: left;
}

.wife-form label {
  font-size: 14px;
  font-weight: bold;
  color: #55504d;
  margin-top: 10px;
}

.wife-form select,
.wife-form textarea {
  width: 100%;
  box-sizing: border-box;
  border: 1px solid #e5dcd5;
  border-radius: 12px;
  padding: 14px;
  font-size: 15px;
  font-family: inherit;
  background: #fffdfb;
  color: #45413e;
}

.wife-form textarea {
  min-height: 90px;
  resize: vertical;
  line-height: 1.6;
}

.wife-form select:focus,
.wife-form textarea:focus {
  outline: none;
  border-color: #c98f91;
  box-shadow: 0 0 0 3px rgba(201, 143, 145, 0.12);
}

#submitPostButton {
  margin-top: 20px;
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 16px;
  background: #c98f91;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}


/* =================================
   LEAD 妻側：フラワー背景
================================= */

#wifeScreen {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  padding: 24px 18px;
  border-radius: 22px;
}

/* 背景写真 */
#wifeScreen::before {
  content: "";
  position: absolute;
  inset: -12px;
  z-index: -2;
  background-image: url("./lead-background.png");
  background-size: cover;
  background-position: center;
  filter: blur(5px);
  transform: scale(1.03);
}

/* 曇りガラスのような白い膜 */
#wifeScreen::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: rgba(255, 255, 255, 0.32);
  pointer-events: none;
}

/* 画面内の文字・入力欄を前面に */
#wifeScreen > * {
  position: relative;
  z-index: 1;
}

/* 入力フォーム */
#wifeScreen .wife-form {
  gap: 14px;
}

#wifeScreen .wife-form label {
  color: #ffffff;
  text-shadow: 0 1px 4px rgba(80, 50, 60, 0.35);
  font-size: 14px;
  letter-spacing: 0.5px;
}

#wifeScreen .wife-form select,
#wifeScreen .wife-form textarea {
  background: rgba(255, 255, 255, 0.68);
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 16px;
  color: #51464a;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 4px 18px rgba(100, 60, 75, 0.06);
}

#wifeScreen #submitPostButton {
  background: rgba(194, 119, 145, 0.88);
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 40px;
  padding: 17px;
  letter-spacing: 1px;
  box-shadow: 0 5px 18px rgba(120, 65, 85, 0.15);
}
    

  </style>
</head>

<body>
  <main class="container">

    <!-- 共通ロゴ -->
    <div class="logo">LEAD</div>

    <!-- ログイン前の画面 -->
    <section id="loginScreen">
      <div class="tagline">
        家族の幸せを、自分から。
      </div>

      <div class="message">
        結婚した日の決意を、<br>
        今日の行動に変える。
      </div>

      <button id="loginButton">
        Googleでログイン
      </button>
    </section>

    <!-- 夫側ホーム -->
    <section id="husbandScreen" hidden>
      <div class="tagline">
        自分から、関係を変えていく。
      </div>

      <div class="message">
        大切な人との関係を、<br>
        今日から少しずつ。
      </div>

      <h2>夫側ホーム</h2>

      <p>妻から届いたメッセージを確認できます。</p>

      <div id="postList">
        <p>投稿を読み込んでいます...</p>
      </div>
    </section>

    <!-- 妻側ホーム -->
    
<section id="wifeScreen" hidden>
  <div class="tagline">気持ちを、安心して伝えられる場所。</div>
  <div class="message">
    あなたの気持ちを、<br>
    大切に受け止めます。
  </div>

  <h2>気持ちを伝える</h2>
  <p>今感じていることを、無理のない範囲で教えてください。</p>

  <div class="wife-form">

    <label for="category">1. 伝えたいこと</label>
    <select id="category">
      <option value="不満">不満</option>
      <option value="要望">要望</option>
      <option value="感謝">感謝</option>
    </select>

    <label for="whatHappened">2. 何があった？</label>
    <textarea id="whatHappened" placeholder="どんな出来事がありましたか？"></textarea>

    <label for="howFelt">3. どう感じた？</label>
    <textarea id="howFelt" placeholder="そのとき、どんな気持ちになりましたか？"></textarea>

    <label for="whatWanted">4. 本当はどうしてほしかった？</label>
    <textarea id="whatWanted" placeholder="本当はどうしてほしかったですか？"></textarea>

    <label for="freeMessage">5. 自由に伝えたいこと（任意）</label>
    <textarea id="freeMessage" placeholder="その他に伝えたいことがあれば自由に書いてください。"></textarea>

    <button type="button" id="submitPostButton">気持ちを届ける</button>

  </div>
</section>


    <p id="status">ログインしてください。</p>

    <button id="logoutButton" hidden>
      ログアウト
    </button>

  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBzPaF8PULQyDw5AjBDal5A_T73tmhlmH8",
      authDomain: "lead-79e60.firebaseapp.com",
      projectId: "lead-79e60",
      appId: "1:736205745651:web:bf8aaa4c3f8bd4cd8db686"
    };

  // GASのウェブアプリURL
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzjTiZVHJP6MzuV_U8nTiCtc9FIfCYS8eUzwZw9-eW5DXkxkvZvZtsoAvUg3lF6PJNl/exec";

   firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const provider = new firebase.auth.GoogleAuthProvider();

  const loginButton = document.getElementById("loginButton");
  const logoutButton = document.getElementById("logoutButton");
  const status = document.getElementById("status");

  const loginScreen = document.getElementById("loginScreen");
  const husbandScreen = document.getElementById("husbandScreen");
  const wifeScreen = document.getElementById("wifeScreen");

  // すべての画面をいったん非表示にする
  function hideAllScreens() {
    loginScreen.hidden = true;
    husbandScreen.hidden = true;
    wifeScreen.hidden = true;
  }


  // GASにログイン情報を確認してもらう
  async function checkLeadRole(user) {
    hideAllScreens();
    status.textContent = "LEADの利用者情報を確認しています...";
    logoutButton.hidden = true;

    try {
      const idToken = await user.getIdToken();

      const response = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify({
          idToken: idToken,
          action: "auth"
        })
      });

      const result = await response.json();

      if (!result.success) {
        status.textContent = "認証できませんでした：" + result.message;
        return;
      }

      if (result.role === "husband") {
        husbandScreen.hidden = false;
        status.textContent = "ログイン中：" + result.email;
        logoutButton.hidden = false;

        await loadPosts(idToken);

      } else if (result.role === "wife") {
        wifeScreen.hidden = false;
        status.textContent = "ログイン中：" + result.email;
        logoutButton.hidden = false;

      } else {
        status.textContent = "利用できる役割が確認できません。";
      }

    } catch (error) {
      console.error("LEAD認証エラー：", error);
      status.textContent = "GASとの通信に失敗しました。Consoleを確認してください。";
    }
  }

  // GASから妻の投稿一覧を取得する
  async function loadPosts(idToken) {
    const postList = document.getElementById("postList");
    postList.textContent = "投稿を読み込んでいます...";

    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify({
          idToken: idToken,
          action: "listPosts"
        })
      });

      const result = await response.json();

      if (!result.success) {
        postList.textContent = "投稿を取得できませんでした：" + result.message;
        return;
      }

      displayPosts(result.posts);

    } catch (error) {
      console.error("投稿取得エラー：", error);
      postList.textContent = "投稿の読み込みに失敗しました。";
    }
  }

  // 投稿一覧を画面に表示する
  function displayPosts(posts) {
    const postList = document.getElementById("postList");
    postList.replaceChildren();

    if (!posts || posts.length === 0) {
      postList.textContent = "まだ投稿はありません。";
      return;
    }

    posts.forEach(post => {
      const card = document.createElement("div");

      card.style.cssText =
        "background:#fff;border:1px solid #e5e1da;" +
        "border-radius:12px;padding:18px;margin:16px 0;text-align:left;";

      const date = new Date(post.createdAt);
      const dateText = isNaN(date.getTime())
        ? ""
        : date.toLocaleString("ja-JP");

      const dateElement = document.createElement("p");
      dateElement.textContent = dateText + "　" + (post.category || "");
      card.appendChild(dateElement);

      function addText(label, value) {
        if (value === null || value === undefined || value === "") return;

        const heading = document.createElement("h3");
        heading.textContent = label;

        const paragraph = document.createElement("p");
        paragraph.textContent = String(value);
        paragraph.style.whiteSpace = "pre-wrap";
        paragraph.style.lineHeight = "1.7";

        card.appendChild(heading);
        card.appendChild(paragraph);
      }

      addText("何があった？", post.whatHappened);
      addText("どう感じた？", post.howFelt);
      addText("本当はどうしてほしかった？", post.whatWanted);
      addText("自由に伝えたいこと", post.freeMessage);

      const divider = document.createElement("hr");
      card.appendChild(divider);

      addText("STEP1｜妻の本当の願い", post.step1);
      addText("STEP2｜すれ違いの構造", post.step2);
      addText("STEP3｜夫自身の気づき", post.step3);

      postList.appendChild(card);
    });
  }

  // ログイン状態を監視する
  auth.onAuthStateChanged((user) => {
    hideAllScreens();

    if (user) {
      checkLeadRole(user);
    } else {
      loginScreen.hidden = false;
      status.textContent = "ログインしてください。";
      logoutButton.hidden = true;
    }
  });

  // Googleログイン
  loginButton.addEventListener("click", async () => {
    try {
      status.textContent = "ログインしています...";
      await auth.signInWithPopup(provider);
    } catch (error) {
      console.error(error);
      status.textContent = "ログインできませんでした。";
    }
  });

  // ログアウト
  logoutButton.addEventListener("click", async () => {
    try {
      await auth.signOut();
    } catch (error) {
      console.error(error);
      status.textContent = "ログアウトできませんでした。";
    }
  });

</script>
</body>
</html>
